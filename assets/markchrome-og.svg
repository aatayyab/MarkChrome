    <text x="0" y="158" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="42" fill="#0b66d8">Write Markdown. Preview instantly. Save locally.</text>
    <text x="0" y="228" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#42526a">A clean browser-based Markdown editor with split-pane preview, toolbar shortcuts, tables, task lists, and local file save.</text>
    <rect x="0" y="295" width="380" height="78" rx="22" fill="url(#g)"/>
    <text x="56" y="346" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="26" fill="#fff">Launch MarkChrome</text>
  </g>
