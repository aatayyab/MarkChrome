    <text x="56" y="284" font-family="Consolas, monospace" font-size="23" fill="#c9d1e0">- Save as .md</text>
    <text x="56" y="348" font-family="Consolas, monospace" font-size="23" fill="#2ecc71">```js</text>
    <text x="56" y="388" font-family="Consolas, monospace" font-size="23" fill="#abb2bf">console.log('ready')</text>
